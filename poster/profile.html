<!doctype html><html lang="mn"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{font-family:"Inter Display","Inter",sans-serif;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(700px 600px at 85% 10%,rgba(255,107,91,.35),transparent 60%),
             radial-gradient(700px 600px at 10% 95%,rgba(255,201,60,.22),transparent 60%),
             linear-gradient(160deg,#14246B,#0B1640 60%)}
.mark{display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:-10px}
.ai{width:470px;height:470px;border-radius:120px;background:#FFC93C;display:grid;place-items:center;position:relative;
  box-shadow:0 40px 80px rgba(0,0,0,.35)}
.ai span{font-weight:900;font-size:300px;letter-spacing:-.04em;color:#0B1640;line-height:1;margin-top:-14px}
.spark{position:absolute;top:-46px;right:-46px}
.word{font-weight:900;font-size:120px;letter-spacing:.06em;color:#fff;line-height:1}
</style></head><body>
<div class="mark">
  <div class="ai"><span>AI</span>
    <svg class="spark" width="150" height="150" viewBox="0 0 100 100"><path d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z" fill="#FF6B5B"/></svg>
  </div>
  <div class="word">БАГШ</div>
</div>
</body></html>
